name: Smoke import test

on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
  workflow_dispatch:

jobs:
  import:
    name: Import ComfyUI-NAG against ComfyUI main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out fork
        uses: actions/checkout@v6
        with:
          path: ComfyUI-NAG

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Clone ComfyUI (latest main)
        run: git clone --depth 1 https://github.com/comfyanonymous/ComfyUI.git ComfyUI

      - name: Install ComfyUI runtime deps (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r ComfyUI/requirements.txt

      - name: Smoke-import NODE_CLASS_MAPPINGS
        run: |
          python - <<'PY'
          import sys, importlib.util, pathlib

          comfyui_root = pathlib.Path('ComfyUI').resolve()
          nag_root = pathlib.Path('ComfyUI-NAG').resolve()
          sys.path.insert(0, str(comfyui_root))

          # ComfyUI's model_management runs `total_vram = get_total_memory(get_torch_device())`
          # at module top level. On a CPU-only runner that call eventually reaches
          # torch.cuda.current_device() and crashes with
          # "AssertionError: Torch not compiled with CUDA enabled".
          # The CPU bypass is gated by `args.cpu == True` (comfy.cli_args).
          # Force it directly before anything triggers model_management import.
          import comfy.cli_args
          comfy.cli_args.args.cpu = True

          spec = importlib.util.spec_from_file_location(
              'ComfyUI_NAG',
              str(nag_root / '__init__.py'),
              submodule_search_locations=[str(nag_root)],
          )
          mod = importlib.util.module_from_spec(spec)
          sys.modules['ComfyUI_NAG'] = mod
          spec.loader.exec_module(mod)
          keys = list(mod.NODE_CLASS_MAPPINGS.keys())
          print('NODE_CLASS_MAPPINGS keys:', keys)
          required = {'KSamplerWithNAG', 'NAGCFGGuider'}
          missing = required - set(keys)
          if missing:
              raise SystemExit(f'Missing expected nodes: {missing}')
          print('OK')
          PY
